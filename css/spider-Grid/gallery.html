<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Gallery</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #gallery{
            width: 100%;
            height: 100%;
            padding: 40px 0px;
            background-color: rgb(238, 235, 235);
        }
        #gallery h2{
            text-align: center ;
        }
        .galleryMid{
            max-width: 1320px;
            margin: auto;
            display: grid;
            margin-top: 40px;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            /* margin-top: 40px; */
        }
        .galleryItems img{
            width: 100%;
            height: 100%;
            margin: auto;
        }
        
        /* pseudo class slector */
        .galleryMid .galleryItems:nth-child(1) , .galleryMid .galleryItems:nth-child(3), .galleryMid .galleryItems:nth-child(5), .galleryMid .galleryItems:nth-child(7) ,.galleryMid .galleryItems:nth-child(10) , .galleryMid .galleryItems:nth-child(8)
        {
grid-row: span 2

        }
       
        
        
       
    </style>
</head>
<body>
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="galleryMid">
            <!-- 10 random images -->
