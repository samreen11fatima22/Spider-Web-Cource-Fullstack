<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        main{
            max-width: 1300px;
            height: 500px;
            border: 1px solid black;
            background-color: navy;
            color: yellow;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: repeat(3,1fr);
            grid-auto-rows: 1fr;
            gap: 20px 20px;
            padding: 50px 20px;
            
        }
        .item1{
            background-color: aqua;
            grid-row: 1/3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item2{
            background-color:magenta;
            grid-column: 2/4;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
       
        .item3{
            background-color: rgb(103, 227, 81);
             grid-column:4/6;
             display: flex;
            justify-content: center;
            align-items: center;
        }
        .item4{
            background-color: rgb(135, 89, 166);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item5{
            background-color: rgb(227, 91, 46);
            grid-column: span 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item6{
            background-color: rgb(63, 103, 238);
            /* grid-row: 1/2; */
            /* grid-row-start: ; */
            grid-row: span 3;
            display: flex;
            justify-content: center;
            align-items: center;

            
        }
        .item7{
            background-color: rgb(210, 213, 42);
            grid-row: span 2;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .item8{
            background-color: black;
            grid-column: span 2;
            grid-row: span 2;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .item9{
            background-color: slategray;
            grid-row: span 2;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>
<body>
    <main>
        <div class="item1">box1</div>
        <div class="item2">box2</div>
        <div class="item3">box3</div>
        <div class="item4">box4</div>
        <div class="item5">box5</div>
        <div class="item6">box6</div>
        <div class="item7">box7</div>
        <div class="item8">box8</div>
        <div class="item9">box9</div>
    </main>
</body>
</html>
