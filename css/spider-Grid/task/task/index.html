<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        font-family: sans-serif;
        }
        .container{
            max-width: 1320px;
            margin: auto;
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas: "header header"
            "sidebar content"
            "footer footer"
              ;

        }
        .header{
            grid-area: header;
            background-color: aqua;
            padding: 10px;
        }
        .sidebar{
            grid-area: sidebar;
            background-color: rgb(252, 135, 190);
            padding: 10px;
        }
        .content{
            grid-area: content;
            background-color: rgb(231, 106, 93);
            padding: 10px;
        }
        .footer{
            grid-area: footer;
            background-color: rgb(115, 210, 52);
            padding: 10px;
        }
     @media (max-width: 768px)
        {
            .container{
                
                grid-template-columns: 1fr;
                grid-template-areas: 
                        
                        "header"
                        "sidebar"
                        "content"
                        "footer";
        }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
