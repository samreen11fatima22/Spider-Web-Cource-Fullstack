<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            /* box-sizing: border-box; */

        }
        .main{
            margin: auto;
            width: 100%;
            height: 700px;
            display: grid;
            grid-template-columns: 20% 1fr 1fr;
            border: 1px solid black;
            gap: 10px;
grid-template-rows: 100px 200px 200px 100px;
       
        font-size: 30px;
        color: white;

        }
        header{
           background-color: yellow;
           grid-column: span 3;
           display: flex;
           justify-content: center;
           align-items: center;
            
        }
        aside{
            grid-row:span 2 ;
            background-color: aqua;
             display: flex;
           justify-content: center;
           align-items: center;
        }
.content1{
    grid-column: span 2;
    background-color: blue;
     display: flex;
           justify-content: center;
           align-items: center;
}
.content2{
    /* grid-column: span 2; */
    background-color: rgb(223, 223, 34);
     display: flex;
           justify-content: center;
           align-items: center;
}
.content3{
    /* grid-column: span 2; */
    background-color: rgb(129, 88, 176);
     display: flex;
           justify-content: center;
           align-items: center;
}
footer{
    background-color: yellow;
    grid-column: span 3;
     display: flex;
           justify-content: center;
           align-items: center;

}
    </style>
</head>
<body>
                    <section class="main">
                        <header>
                            CSS Grid
                        </header>
                        <aside>Asidebar</aside>
                        <div class="content1">Content</div>
                        <div class="content2">Content</div>
                        <div class="content3">Content</div>
                        <footer>Footer</footer>

                    </section>
</body>
</html>
